# Issuers that name their fiscal year by the calendar year in which it STARTS. Our label is the year in which it
# ends; the SEC's XBRL label follows the issuer. Only the companies listed here, in this direction
# and up to the given filing date, count as a naming convention; any other disagreement is a real one.
[[naming_conventions]]
ticker = "GME"
sec_year_offset = -1
note = "GameStop calls the year ended 2025-02-01 'fiscal 2024'; every XBRL label since 2009 is one year below ours, same period."
evidence = "sec-filings verify-labels on 2026-11-07: 73 of 73 labelled GME filings differ by exactly one year with the same period; GameStop 10-K cover pages."

[[naming_conventions]]
ticker = "WMT"
sec_year_offset = -1
until = 2014-03-21
note = "Walmart labelled fiscal years by their start year up to the 10-K filed 2014-03-21 (period 2014-01-31 labelled 2013); from the next filing on its labels agree with ours."
evidence = "sec-filings verify-labels on 2026-11-07: the 20 WMT disagreements are all filings up to 2014-03-21; none after."

[[naming_conventions]]
ticker = "TM"
sec_year_offset = -1
until = 2017-06-23
note = "Toyota labelled 20-Fs by the start year up to the 20-F filed 2017-06-23 (period 2017-03-31 labelled 2016); later 20-Fs agree with ours."
evidence = "sec-filings verify-labels on 2026-11-07: the 8 TM disagreements are 20-Fs filed 2010 to 2017-06-23; none after."


key = "0000732717-14-000129"
note = "AT&T 10-Q filed 2014-11-10: cover page says 'For the quarterly period ended September 30, 2014' (read 2026-11-07), third quarter; the SEC's XBRL label says Q2."

[[accepted_findings]]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-filings"
version = "0.1.0"
description = "Daily job that keeps a Postgres table of the annual and quarterly reports 20 companies filed with the SEC (EDGAR)."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sec-filings = "sec_filings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sec_filings = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
